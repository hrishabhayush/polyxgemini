global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "polyxgemini-bot"
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          instance: "bot"

  - job_name: "ncaa-ml-live"
    static_configs:
      - targets: ["host.docker.internal:9200"]
        labels:
          instance: "ml-live"
