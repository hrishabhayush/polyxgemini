polymarket:
  clob_base_url: "https://clob.polymarket.com"
  gamma_base_url: "https://gamma-api.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/"
  watchlist_path: "config/markets.yaml"
  api_key: ""
  api_secret: ""
  passphrase: ""

gemini:
  base_url: "https://api.gemini.com/v1/prediction-markets"
  ws_url: "wss://ws.gemini.com"
  sandbox_url: "https://api.sandbox.gemini.com/v1/prediction-markets"
  api_key: ""
  api_secret: ""
  use_sandbox: true

engine:
  poll_interval_ms: 1000
  min_spread_bps: 50
  max_position_usd: 1000.0
  dry_run: true

hedge:
  mode: "auto"
  curve_alpha: 2.0
  curve_beta: 3.0
  max_hedge_qty: 15
  loss_threshold_pct: 0.15
  mild_loss_threshold_pct: 0.05
  max_total_exposure: 50.0
  gemini_half_spread: 0.01
  rebalance_threshold: 1.0
  poll_interval_ms: 5000
