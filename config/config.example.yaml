polymarket:
  clob_base_url: "https://clob.polymarket.com"
  gamma_base_url: "https://gamma-api.polymarket.com"
  data_base_url: "https://data-api.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/"
  watchlist_path: "config/markets.yaml"
  # Order signing (see cmd/derivekey for API credentials). Use config/config.yaml locally (gitignored).
  wallet_address: "" # funder; omit to use address derived from private_key
  private_key: "" # hex, optional 0x prefix
  signature_type: 0 # 0 EOA, 1 Polymarket proxy, 2 Gnosis Safe
  api_key: ""
  api_secret: ""
  passphrase: ""

gemini:
  base_url: "https://api.gemini.com/v1/prediction-markets"
  ws_url: "wss://ws.gemini.com"
  sandbox_url: "https://api.sandbox.gemini.com/v1/prediction-markets"
  api_key: ""
  api_secret: ""
  use_sandbox: true

engine:
  poll_interval_ms: 1000
  min_spread_bps: 50
  max_position_usd: 1000.0
  dry_run: true

hedge:
  mode: "auto"
  curve_alpha: 2.0
  curve_beta: 3.0
  max_hedge_qty: 15
  loss_threshold_pct: 0.15
  mild_loss_threshold_pct: 0.05
  max_total_exposure: 50.0
  gemini_half_spread: 0.01
  rebalance_threshold: 1.0
  poll_interval_ms: 5000
  game_duration_min: 40
  ml_server_url: "http://localhost:8766"
  min_edge: 0.05

sentiment:
  newsapi_key: "8a4028324fe348a6a6b337f09287562f"
  newsapi_base_url: "https://newsapi.org/v2"
  gdelt_base_url: "https://api.gdeltproject.org/api/v2/doc/doc"
  reddit_base_url: "https://www.reddit.com"
  reddit_user_agent: "sentimentbot/1.0"
  reddit_client_id: ""
  reddit_client_secret: ""
  reddit_subreddits:
    - "politics"
    - "worldnews"
    - "news"
    - "PredictionMarkets"
  finbert_server_url: "http://localhost:8765"
  poll_interval_sec: 150
